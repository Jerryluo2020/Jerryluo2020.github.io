name: Daily A-share snapshot
on:
  schedule:
    - cron: '23 8 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'a-share-source/**'
      - '.github/workflows/daily-market.yml'
permissions:
  contents: read
concurrency:
  group: a-share-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Install dependencies
        working-directory: a-share-source
        run: pnpm install --frozen-lockfile
      - name: Build browser analysis
        working-directory: a-share-source
        run: pnpm exec vite build --config github-pages/vite.config.ts
      - name: Choose cache date
        id: cache-date
        working-directory: a-share-source
        run: node --input-type=module -e "import {completeDate} from './lib/pattern.ts'; console.log('date='+completeDate())" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: snapshot-cache
          key: daily-snapshot-v2-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daily-snapshot-v2-${{ steps.cache-date.outputs.date }}-
      - name: Collect complete daily snapshot
        working-directory: a-share-source
        run: node scripts/collect-snapshot.mjs ../github-pages-dist/data ../snapshot-cache
      - name: Save collection checkpoint
        if: always() && steps.cache-date.outputs.date != ''
        uses: actions/cache/save@v4
        with:
          path: snapshot-cache
          key: daily-snapshot-v2-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-diagnostics
          path: |
            github-pages-dist/data/failures.json
            github-pages-dist/data/progress.json
          if-no-files-found: ignore
      - name: Preserve homepage and prepare Pages artifact
        run: |
          mkdir -p public-site
          cp -a README.md index.html test.html public-site/
          cp -a github-pages-dist public-site/a-share
          cp a-share-source/public/favicon.svg public-site/a-share/
          touch public-site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy daily snapshot
        id: deployment
        uses: actions/deploy-pages@v4
